<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a guild handbook read by lantern light. One long page in chapters, sticky chapter tabs,
   bestiary and class roster as card grids, everything else as reference tables. Single dark look on purpose. */
:root {
  color-scheme: dark;
  --ink: #15121b;          /* page */
  --vellum: #1e1a26;       /* raised surfaces */
  --vellum-2: #282233;     /* table stripes, chips */
  --rule: #3b3247;         /* hairlines */
  --text: #efe4d0;         /* parchment text */
  --muted: #b3a690;        /* captions */
  --gold: #e2b85a;         /* the accent: OmniBullet's gold */
  --gold-dim: #8a6d2f;
  --danger: #ff7a6b;
  --ok: #8fd6a0;
  --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --body: 'Alegreya', 'Iowan Old Style', Georgia, serif;
  --ui: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --step-0: 1.05rem; --step-1: 1.25rem; --step-2: 1.6rem; --step-3: 2.2rem; --step-4: clamp(2.4rem, 6vw, 3.6rem);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--ink); color: var(--text); font: 400 var(--step-0)/1.6 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
a { color: var(--gold); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; line-height: 1.15; margin: 0; }
h2 { font-size: var(--step-3); color: var(--gold); }
h3 { font-size: var(--step-2); }
p { margin: 0; max-width: 68ch; }
.lede { color: var(--muted); font-style: italic; }
code, .cmd { font-family: var(--ui); font-weight: 700; color: var(--gold); white-space: nowrap; }
.label { font-family: var(--ui); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* masthead */
header.mast { border-bottom: 1px solid var(--rule); background:
  radial-gradient(60% 120% at 85% 0%, #3a2a1255, transparent 70%), var(--ink); }
.mast .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; padding-block: 40px 28px; }
.mast h1 { font-size: var(--step-4); }
.mast h1 small { display: block; font-size: .42em; color: var(--gold); letter-spacing: .08em; margin-bottom: 6px; }
.mast .intro { display: grid; gap: 14px; min-width: 0; }
.mast img { width: 150px; height: auto; filter: drop-shadow(0 6px 18px #e2b85a40); }
.ledger { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--ui); color: var(--muted); }
.ledger b { color: var(--text); font-weight: 700; }
@media (max-width: 620px) { .mast .wrap { grid-template-columns: 1fr; } .mast img { display: none; } }

/* chapter tabs */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #15121bf2; border-bottom: 1px solid var(--rule); backdrop-filter: blur(6px); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
nav.tabs a { font-family: var(--ui); font-weight: 500; text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
nav.tabs a:hover, nav.tabs a.on { color: var(--ink); background: var(--gold); }

section.chapter { padding-block: 56px 8px; display: grid; gap: 28px; }
.chapter > header { display: grid; gap: 8px; border-bottom: 1px solid var(--rule); padding-bottom: 14px; }
.block { display: grid; gap: 12px; align-content: start; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px 32px; align-items: start; }
.cols > * { min-width: 0; }
ul.plain { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.note { border-left: 2px solid var(--gold-dim); padding: 4px 0 4px 14px; color: var(--muted); max-width: 70ch; }

/* reference tables */
.table { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-family: var(--ui); font-size: .95rem; }
table.wide { min-width: 600px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--rule); background: var(--vellum); }
td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:nth-child(even) td { background: #1a1621; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--ui); font-size: .82rem; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--vellum-2); color: var(--text); white-space: nowrap; }
.chip.el { color: var(--ink); font-weight: 700; }
.chip.warn { background: #4a1f22; color: #ffc2b8; }
.chip.gold { background: #4a3a17; color: #ffe2a0; }

/* bestiary */
.beasts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.beast { background: var(--vellum); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.beast .stage { aspect-ratio: 8 / 7; max-width: 100%; display: grid; place-items: end center; background:
  radial-gradient(60% 55% at 50% 62%, var(--aura, #e2b85a) 0%, transparent 72%), #120f17; position: relative; }
.beast .stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 50%, #120f17 100%); pointer-events: none; }
.beast .stage img { width: 88%; height: auto; position: relative; z-index: 1; margin-bottom: 4%; }
.beast .stage .badge { position: absolute; top: 10px; left: 10px; z-index: 2; }
.beast .body { padding: 14px 16px 16px; display: grid; gap: 10px; align-content: start; }
.beast h3 { font-size: 1.45rem; }
.beast .tag { font-family: var(--ui); font-size: .76rem; letter-spacing: .1em; color: var(--muted); }
.beast dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-family: var(--ui); font-size: .92rem; }
.beast dt { color: var(--muted); }
.beast dd { margin: 0; }
.beast .lore { font-size: .95rem; color: var(--muted); font-style: italic; }
.beast.locked .stage { --aura: #5a4b70; }
.beast.locked .stage img { opacity: .9; }
.beast.locked h3 { color: var(--muted); letter-spacing: .3em; }
.beast.wide { grid-column: 1 / -1; grid-template-rows: none; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); }
@media (max-width: 700px) { .beast.wide { grid-template-columns: 1fr; } }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
/* monster forms: a badge per variant and BOSS, lit once beaten; a lit one recolours the art */
.forms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.form { font: 600 .78rem var(--ui); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px; background: #1b1622; color: var(--muted); opacity: .45; }
.form.on { opacity: 1; color: #f3e6c8; border-color: var(--f); background: color-mix(in srgb, var(--f) 22%, #1b1622); cursor: pointer; }
.form.on[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--f); }
.beast .stage img { transition: filter .3s; }
.beast .stage.boss img { filter: drop-shadow(0 0 14px #ff9a3a); }

/* classes */
.tier { display: grid; gap: 12px; }
.tier-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.job { background: var(--vellum); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.job .top { display: flex; gap: 10px; align-items: center; }
.job .ico { font-size: 1.6rem; line-height: 1; }
.job h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.3rem; }
.job p { font-size: .95rem; }
.job .req { font-family: var(--ui); font-size: .82rem; color: var(--muted); }

.summons { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.summon { background: var(--vellum); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.summon img { display: block; width: 100%; height: 170px; object-fit: contain; object-position: center bottom; background: radial-gradient(60% 60% at 50% 70%, var(--aura) 0%, transparent 75%), #120f17; }
.summon div { padding: 12px 14px; display: grid; gap: 4px; }

.legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.legend { background: var(--vellum); border: 1px solid var(--gold-dim); border-radius: 8px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.legend .big { font-family: var(--display); font-size: 1.6rem; color: var(--gold); }
footer { border-top: 1px solid var(--rule); margin-top: 56px; }
footer .wrap { padding-block: 22px 40px; color: var(--muted); font-family: var(--ui); font-size: .9rem; display: grid; gap: 4px; }
</style>

      <h1><small>OmniBullet · Community Boss</small>The Adventurer's Handbook</h1>

<script>
(() => {
const D = JSON.parse(document.getElementById('hb-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pct = (x, d = 0) => (x * 100).toFixed(d).replace(/\.0+$/, '') + '%';
const plus = x => '+' + pct(x);
const n = x => Number(x).toLocaleString('en-US');
const cmd = c => `<span class="cmd">${esc(c.startsWith('!') ? c : '!' + c)}</span>`;
const table = (heads, rows, right = []) => `<div class="table"><table${heads.length > 3 ? ' class="wide"' : ''}><thead><tr>${heads.map((h, i) => `<th${right.includes(i) ? ' class="r"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td${right.includes(i) ? ' class="r"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const ELS = {}; for (const a of D.attacks.commands) ELS[a.id] = a;
ELS.fate = { id: 'fate', icon: '☀', label: 'Fate', color: '#ffd96b' };
ELS.physical = { id: 'physical', icon: '⚔', label: 'Physical', color: '#ff6388' };
const el = id => { const e = ELS[id === 'attack' ? 'attack' : id] || { icon: '', label: id, color: '#ccc' };
  return `<span class="chip el" style="background:${e.color}">${e.icon} ${esc(id === 'attack' ? 'Physical' : e.label)}</span>`; };
const elWord = id => { const e = ELS[id] || { icon: '', label: id }; return `${e.icon} ${id === 'attack' ? 'physical' : e.label.toLowerCase()}`; };

const ROLE = {
  tank:    { name: 'Tank',    move: 'provoke',   does: 'For 30s the monster\'s strikes and curses hit only the tank. The tank gets up in half the time, curses on them last half as long, and the party\'s fear is cleared.' },
  healer:  { name: 'Healer',  move: 'cleanse',   does: 'Removes every curse from the party, DOOM included.' },
  caster:  { name: 'Caster',  move: 'dispel',    does: 'Strips the monster\'s buffs (scales, shells, reflect, regrowth, haste).' },
  ranged:  { name: 'Ranged',  move: 'reveal',    does: 'Undoes VANISH and BURROW, reveals the weakness and marks the monster: +' + pct(D.teamwork.markCrit) + ' crit for everyone for ' + D.teamwork.markSec + 's.' },
  rogue:   { name: 'Rogue',   move: 'interrupt', does: 'Stops a monster ability during its ⚠ warning, before it lands.' },
  fighter: { name: 'Fighter', move: 'pierce',    does: 'The next ' + D.teamwork.pierceCharges + ' attacks ignore the monster\'s defenses and barriers.' },
  all:     { name: 'Any role', move: 'any',      does: 'Can use every team move.' },
};
const COUNTER = { dispel: '!dispel', pierce: '!pierce', cleanse: '!cleanse', reveal: '!reveal', interrupt: '!interrupt', provoke: '!provoke', dodge: '!dodge', earth: '🪨 earth hits', fire: '🔥 burning stops it' };
const counters = list => (list || []).length ? list.map(c => c.startsWith('!') || COUNTER[c]?.startsWith('!') ? cmd(COUNTER[c] || c) : esc(COUNTER[c] || c)).join(' or ') : '<span class="label">no counter</span>';

const chapters = [];
const chapter = (id, title, lede, html) => chapters.push({ id, title, html: `<section class="chapter" id="${id}"><header><h2>${title}</h2>${lede ? `<p class="lede">${lede}</p>` : ''}</header>${html}</section>` });

/* ---------------- masthead ---------------- */
const P = D.progress || {};
const unlocked = D.bestiary.filter(b => !b.locked).length;
const gearTier = i => D.hero.gearTiers[i] || D.hero.gearTiers[0];
$('#ledger').innerHTML = [
  `<span><b class="num">${unlocked}</b> of <b class="num">${D.bestiary.length}</b> monsters discovered</span>`,
  D.forms && D.forms.total ? `<span><b class="num">${D.forms.found}</b> of <b class="num">${D.forms.total}</b> monster forms</span>` : '',
  (D.bosses || []).length ? `<span><b class="num">${D.bosses.filter(b => !b.locked).length}</b> of <b class="num">${D.bosses.length}</b> bosses defeated</span>` : '',
  P.hero ? `<span>OmniBullet <b class="num">LV ${n(P.hero.level)}</b>${P.hero.reborn ? ' ★' + P.hero.reborn : ''}</span>` : '',
  P.adventurers ? `<span><b class="num">${P.adventurers}</b> adventurers on the roster</span>` : '',
].join('');
if (D.hero.img) $('#hero-img').src = D.hero.img; else $('#hero-img').remove();

/* ---------------- 1. getting started ---------------- */
const E = D.encounter;
const A = D.attacks;
const attackRows = A.commands.map(a => {
  const t = D.elements[a.id] || {};
  const cd = t.cooldownSec || A.cooldownSec;
  const dmg = t.damage ? pct(t.damage) : '100%';
  const what = {
    attack: 'Physical. Boosted by the Omniblade and by physical classes.',
    fire: `The monster burns for ${t.burnSec}s and takes ${plus(t.burnBonus)} from every hit. Burning also stops regrowth.`,
    ice: `During a charge, each hit adds ${t.slowSec}s to the break timer (up to ${t.slowMaxSec}s). Otherwise it pushes the next charge back ${t.delaySec}s.`,
    bolt: `${plus(t.critBonus)} crit chance.`,
    wind: 'Fast: quicker to recharge, lighter hits. Same damage per minute.',
    earth: 'Heavy: slow to recharge, hits hard. The only thing that reaches a burrowed monster.',
  }[a.id] || '';
  return [`${cmd(a.cmd)}`, `${a.icon} ${esc(t.trait || 'strike')}`, `${cd}s`, dmg, what];
});
const commandsAll = [
  ['!join', 'Join the party (also counts toward summoning a monster)'],
  ['!attack !fire !ice !bolt !wind !earth', 'Free attacks, one shared cooldown'],
  ['!slash !omnislash !fate …', 'OmniBullet\'s special moves, once he has learned them (their own longer cooldown)'],
  ['!revive <name>', 'Revive a knocked-out ally (spends your attack)'],
  ['!class <name> · !classes', 'Pick a class between fights · see your class levels and next unlock'],
  ['your class skill', 'e.g. !guard, !overload, !steal (see Classes)'],
  ['!provoke !cleanse !dispel !reveal !interrupt !pierce', 'Team moves, one per role'],
  ['!dodge', 'Anyone: escape ERASURE when you are marked'],
  ['!limit', 'Start or join a PARTY LIMIT when the gauge is full'],
  ['!summon <name> · !summon', 'Start a summon ritual · join one'],
  ['!forge blade|bracers|coat|boots', 'Vote on OmniBullet\'s next upgrade after a victory'],
  ['!1 !2 !3 !4', 'Vote in a story vote'],
  ['!me · !codex · !bounty', 'Your stats and spell ranks · your Monster Codex · your personal bounty'],
  ['!top · !top all', 'This week\'s damage race · all-time leaderboard'],
  ['!hero · !moves · !board · !bloom · !superboss', 'OmniBullet\'s stats · his special moves · tonight\'s bounties · World Boss meter · superbosses'],
  ['!guide · !skill <class> · !spells', 'The guide on screen · any class explained · element cheat sheet'],
];
chapter('start', 'Getting Started', 'Nothing is on screen until something summons a monster. Then everyone in chat can fight it, for free.', `
<div class="cols">
  <div class="block"><h3>How a fight starts</h3><ul class="plain">
    <li><b>Any donation</b> summons a monster right away and lands the first hit. Name a monster in your message to pick which one (see Support).</li>
    <li><b>Or ${E.summonChatters} different chatters</b> using any attack, ${cmd('!join')}, or following within ${E.summonWindowSec / 60} minutes.</li>
    <li>After a fight, monsters <b>rest for ${E.chatRestMin} minutes</b>: chat can't summon again until then, so free fights stay a special event. Donations and channel-point summons still work.</li>
  </ul></div>
  <div class="block"><h3>How a fight ends</h3><ul class="plain">
    <li><b>Victory:</b> loot for the party, XP and shards for OmniBullet, and the MVP gets named.</li>
    <li><b>It flees</b> if nobody hits it for ${E.fleeAfterIdleSec / 60} minutes (OmniBullet's coat buys more time). The damage you dealt carries over to the next monster, but it can only take up to ${pct(E.openingStrikeMax)} of a new monster's HP at once.</li>
    <li>Every monster beaten in a stream makes the next one ${plus(D.hpGrowth - 1)} tougher. It resets after ${D.newStreamGapHours} quiet hours.</li>
  </ul></div>
</div>
<div class="block"><h3>Free attacks</h3>
<p>All attacks share one cooldown per viewer (${A.cooldownSec}s; wind and earth have their own), so spamming different commands doesn't help. Every attack has a ${pct(A.critChance)} chance to crit for double damage.</p>
${table(['Command', 'Trait', 'Cooldown', 'Damage', 'What it does'], attackRows, [2, 3])}

<div class="block"><h3>Ability glossary</h3><p>Every monster ability the guild has seen, and how to answer it.${D.hiddenAbilities ? ` <b>${D.hiddenAbilities}</b> more belong to monsters nobody has beaten yet.` : ''}</p>
${table(['Ability', 'Target', 'Effect', 'Lasts', 'Counter'], abRows, [3])}</div>`);

/* ---------------- 4. classes ---------------- */
const CL = D.classes;
const byId = Object.fromEntries(CL.list.map(c => [c.id, c]));
const reqText = c => Object.keys(c.requires || {}).length ? 'Needs ' + Object.entries(c.requires).map(([id, lv]) => `${byId[id]?.icon || ''} ${esc(byId[id]?.name || id)} LV ${lv}`).join(' + ') : 'Available to everyone';
const jobCard = c => `<div class="job"><div class="top"><span class="ico">${c.icon}</span><div><h4>${esc(c.name)}</h4><span class="label">${esc(ROLE[c.role]?.name || c.role)} · ${c.role === 'all' ? 'every team move' : 'team move ' + esc('!' + ROLE[c.role]?.move)}</span></div></div>
  <p>${esc(c.desc).replace(/(![a-z]+)/g, '<span class="cmd">$1</span>')}</p><div class="req">${reqText(c)}</div></div>`;
const tiers = [[1, 'Base classes', 'Everyone starts with these six.'], [2, 'Advanced classes', 'Unlock with two base classes at LV 50.'], [3, 'Legendary classes', 'Unlock with two advanced classes at LV 99.'], [4, 'The final class', 'All four legendary classes at LV 99.']];
const lvXp = L => Math.round(CL.xp.curve * Math.pow(L - 1, CL.xp.exp));
chapter('classes', 'Classes', 'Every viewer picks a class. Each one has its own level from 1 to 99, a passive bonus, a skill, and a role with a team move.', `
<div class="cols">
  <div class="block"><h3>How classes work</h3><ul class="plain">
    <li>Switch with ${cmd('!class name')}, only between fights. ${cmd('!classes')} shows your levels and what unlocks next.</li>
    <li>Each attack gives your current class ${CL.xp.perAttack} XP, and each $1 donated gives it ${CL.xp.perUsd} XP. LV 50 takes about ${n(Math.round(lvXp(50) / CL.xp.perAttack))} attacks, LV 99 about ${n(Math.round(lvXp(99) / CL.xp.perAttack))}.</li>
    <li>Passives and skills grow with the level, from 40% strength at LV 1 to full at LV 99. Skill cooldowns start at ${CL.skillCooldownSec}s and shrink 40% by LV 99.</li>
    <li>Class passives boost your free attacks. Skills arm your next hit or help the party.</li>
    <li><b>FULL PARTY:</b> once a tank, a caster, a rogue and a healer have all hit the same monster, everyone deals ${plus(CL.fullParty.bonus)} for the rest of the fight.</li>
  </ul></div>
  <div class="block"><h3>Roles &amp; team moves</h3>
  ${table(['Role', 'Move', 'What it does'], Object.entries(ROLE).filter(([k]) => k !== 'all').map(([k, r]) => [esc(r.name), cmd(r.move), esc(r.does)]))}
  <p class="note">Team moves share a ${TW.roleCooldownSec}s cooldown, which isn't spent if there's nothing to counter. Fateweaver can use them all.</p></div>
</div>
${tiers.map(([t, title, sub]) => `<div class="tier"><div class="tier-head"><h3>${title}</h3><span class="lede">${sub}</span></div><div class="roster">${CL.list.filter(c => c.tier === t).map(jobCard).join('')}</div></div>`).join('')}`);

/* ---------------- 5. teamwork ---------------- */
const LB = TW.limit, RI = TW.ritual, SM = D.summons;
const comboRows = TW.combos.map(c => [`${c.icon} <b>${esc(c.name)}</b>`, c.roles.map(r => r === 'dps' ? 'any damage class' : esc(ROLE[r]?.name || r)).join(' + '), `${pct(c.mult)} of the hits`]);
chapter('teamwork', 'Teamwork', 'The party is stronger together. These are the moves that need more than one person.', `
<div class="block"><h3>Class combos</h3><p>When viewers of different classes land hits within <b>${TW.comboWindowSec}s</b> of each other, they trigger a combo for bonus damage (at most one every ${TW.comboCooldownSec}s).</p>
${table(['Combo', 'Classes', 'Bonus damage'], comboRows, [2])}</div>
<div class="cols">
  <div class="block"><h3>★ Party Limit</h3><ul class="plain">
    <li>A shared gauge that fills from damage (full after ${LB.fillPct}% of a monster's HP), plus combos (+${LB.comboFill}), BREAKs (+${LB.breakFill}) and team moves (+${LB.roleFill}). It carries over between fights.</li>
    <li>When it's full, someone types ${cmd('!limit')} and at least ${LB.need} people join with ${cmd('!limit')} within ${LB.windowSec}s. If not enough join it fizzles but stays charged.</li>
    <li>More people and more different roles make it bigger, up to ${pct(LB.maxPct)} of the monster's HP. ★★ at ${LB.lv2} joiners, ★★★ at ${LB.lv3}.</li>
    <li>It always breaks a charge, shatters barriers and pierces defenses. Each role adds something: tanks guard, healers revive and cleanse, casters dispel, rogues interrupt, ranged mark.</li>
  </ul></div>
  <div class="block"><h3>✦ Summons</h3><ul class="plain">
    <li>Every hit fills the shared Summon Gauge (it banks up to ${RI.gaugeMax}%).</li>
    <li>When it's full, one viewer starts a ritual with ${cmd('!summon name')} and others join with ${cmd('!summon')} within ${RI.sec}s (${RI.need} needed). Each extra voice adds ${plus(RI.perExtra)} power.</li>
    <li>Every extra summon in the same fight costs more (2nd ${100 + RI.costStep * 100}%, 3rd ${100 + RI.costStep * 200}%…).</li>
    <li>A <b>$${SM.donateUsd}+ donation</b> naming a summon calls it instantly, no gauge or ritual needed.</li>
  </ul></div>
</div>
<div class="summons">${SM.list.map(s => `<div class="summon" style="--aura:${s.color}66">${s.img ? `<img src="${s.img}" alt="${esc(s.name)}" loading="lazy">` : ''}<div><h4 style="margin:0;font-family:var(--display);font-weight:400;font-size:1.3rem">${s.icon} ${esc(s.name)}</h4><span>${el(s.element)}</span><span>Deals ${pct(s.dmg)} of the monster's max HP (×1.5 on its weakness) and ${esc(s.desc)}.</span><span>${cmd('!summon ' + s.id)}</span></div></div>`).join('')}</div>`);

/* ---------------- 6. progression ---------------- */
const H = D.hero;
const specialRows = H.unlocks.map(u => [`LV ${n(u.level)}`, cmd(u.cmd), `${u.icon} ${esc(u.label)}`, u.scan ? 'reveals the weakness' : `${u.damage} base damage`]);
const tierRows = H.gearTiers.map(t => [`<span style="color:${t.color};font-weight:700">${esc(t.name)}</span>`, `LV ${n(t.level)}`, t.cost ? n(t.cost) + ' ◆' : '—', t.power]);
const gearRows = Object.entries(H.gear).map(([slot, g]) => [esc(g.label), esc({ blade: `+${g.physical} physical damage and +${pct(g.crit)} crit per tier`, bracers: `+${g.spell} spell damage per tier`, coat: `monsters wait ${g.fleeSec}s longer before fleeing, per tier`, boots: `chat cooldowns ${g.cooldownSec}s shorter per tier` }[slot] || '')]);
const B2 = D.bounties;
const titleRows = D.titles.map(t => [esc(t.title), `party LV ${t.level}`]);
chapter('progression', 'Progression', 'What carries over from stream to stream: OmniBullet himself, and every adventurer\'s titles.', `
<div class="cols">
  <div class="block"><h3>OmniBullet levels up</h3><ul class="plain">
    <li>He earns XP from all the damage chat deals (${H.xpPerDamage} per point) plus a kill bonus. The cap is LV ${n(H.levelCap)}.</li>
    <li>Each level makes chat's moves ${plus(H.levelBonus)} stronger. Monsters keep up with him, so fights stay fights; his growth only makes them a little quicker.</li>
    <li>At LV ${n(H.reincarnation.atLevel)} chat votes on <b>reincarnation</b>: back to LV 1 with a ★, keeping all gear and moves, plus ${plus(H.reincarnation.damage)} damage and ${plus(H.reincarnation.xp)} XP forever.</li>
  </ul>
  <h3>Special moves</h3><p>Once he learns them, everyone in chat can use these. They share a ${A.specialCooldownSec}s cooldown per viewer.</p>
  ${table(['Learned at', 'Command', 'Move', 'Effect'], specialRows)}</div>
  <div class="block"><h3>The forge</h3><ul class="plain">
    <li>Kills and donations earn <b>Omni Shards</b> (${H.shardsPerUsd} per $1). After a victory with enough shards, chat has ${H.forgeVoteSec}s to vote with ${cmd('!forge blade')}, <span class="cmd">bracers</span>, <span class="cmd">coat</span> or <span class="cmd">boots</span>.</li>
    <li>Each tier needs OmniBullet's level. From Legendary on, a tier is refined +1 to +${H.refine.max} before the next one.</li>
  </ul>
  ${table(['Slot', 'What a tier adds'], gearRows)}
  ${table(['Tier', 'Needs', 'Cost', 'Power'], tierRows, [1, 2, 3])}</div>
</div>
<div class="cols">
  <div class="block"><h3>Titles</h3><p>Your title shows on your party chip and in ${cmd('!me')}. The highest one you hold is shown: Grand Champion, then an honor title, then a slayer title, then a Codex or Bounty title, then your rank.</p>
  ${table(['Rank (by total damage)', 'Needs'], titleRows, [1])}
  <ul class="plain"><li><b>🏆 ${esc(D.codex.champion)}:</b> every Monday, the top damage dealer of last week's race (${cmd('!top')}) is crowned.</li>
  <li><b>📖 ${esc(D.codex.hunter)}:</b> defeat every regular monster. <b>${esc(D.codex.master)}:</b> also the rare and legendary ones, every variant and a boss.${D.codex.bosses ? ` <b>👑 ${esc(D.codex.bosses)}:</b> beat every dedicated boss.` : ''} Codex titles are permanent. Check yours with ${cmd('!codex')}.</li>
  <li><b>Slayer titles</b> (🌸 Bloomslayer, ⚜ superboss titles): for everyone who hits the World Boss or a superboss in the fight that brings it down.</li></ul></div>
  <div class="block"><h3>📜 Bounty Board</h3><ul class="plain">
    <li>Every stream posts ${B2.perStream} community bounties (${cmd('!board')}). One is always a <b>WANTED</b> monster, which donors can call by name.</li>
    <li>Each one completed gives OmniBullet shards and every fighter that night class XP. Clearing the board adds +${B2.clearShards} ◆ and +${B2.clearXp} XP.</li>
    <li>Everyone also gets personal bounties, one at a time and up to ${B2.personalMax} a stream (${cmd('!bounty')}): +${B2.personalXp} class XP each.</li>
  </ul>
  ${table(['Bounty title', 'Bounties done'], B2.titles.map(t => [esc(t.title), t.n]), [1])}
  <h3>Patrons</h3><p>Lifetime supporters get a badge on their party chip.</p>
  ${table(['Badge', 'Tier', 'Total support'], D.patrons.tiers.map(t => [t.badge, esc(t.name), '$' + t.usd]), [2])}</div>
</div>`);

/* ---------------- 7. support ---------------- */
const V = D.value, S = D.summon;
const tierDesc = { Attack: 'a hit', Craft: 'a spell of a random element', 'LIMIT BREAK': 'a bigger spell with a banner', 'S-CRAFT': `all three elements at full power; always takes at least ${pct(D.donations.sCraftMinPct)} of a monster's HP (${pct(D.donations.sCraftMinPctBoss)} of a boss)` };
const tierRows2 = D.tiers.map((t, i) => [`$${t.minUsd}${D.tiers[i + 1] ? '–' + (D.tiers[i + 1].minUsd) : '+'}`, `<b>${esc(t.label)}</b>`, esc(tierDesc[t.label] || '')]);
const valueRows = [
  ['100 bits', '$' + (100 * V.bit)], ['Twitch sub (Tier 1 / Prime)', '$' + V.twitchTier1], ['Twitch Tier 2 / Tier 3', `$${V.twitchTier2} / $${V.twitchTier3}`],
  ['YouTube member', '$' + V.youtubeMember], ['Gifted YouTube membership', '$' + V.youtubeGiftedMember], ['Kick sub / gifted sub', `$${V.kickSub} / $${V.kickGiftedSub}`], ['100 KICKs', '$' + (100 * V.kick)],
];
chapter('support', 'Support', 'Free attacks win fights, and support speeds them up. Every way of supporting the stream does something in the game.', `
<div class="cols">
  <div class="block"><h3>Donations hit hard</h3><ul class="plain">
    <li><b>$1 = ${D.damagePerUsd} damage</b> (a free attack does about 10). Donation damage grows with the night's monsters, so it never falls behind.</li>
    <li>Any donation <b>revives the whole party</b>, and one when nothing is on screen <b>summons a monster</b>.</li>
    <li>A new follow or YouTube subscribe hits for ${D.followDamage}.</li>
  </ul>
  ${table(['Amount', 'Attack', 'What it does'], tierRows2)}</div>
  <div class="block"><h3>What everything counts as</h3>${table(['Support', 'Counts as'], valueRows, [1])}
  <p class="note">Super Chats, cheers, tips and Ko-fi all count. Other currencies are converted to dollars.</p></div>
</div>
<div class="block"><h3>Name it in your message</h3>
${table(['Write…', 'With', 'What happens'], [
  ['a monster\'s name (“dragon”, “krabs”…)', 'any donation', 'Summons that monster now, or puts it next in line (first come, first served). Rare monsters can\'t be picked.'],
  ['a variant (“armored dragon”)', 'any donation', 'Summons that version'],
  ['“boss” + a monster', `$${S.bossUsd}+`, 'Makes it a BOSS fight'],
  ['“shiny” + a monster', `$${S.shinyUsd}+`, 'Makes it a Shiny one'],
  ['phoenix / leviathan / titan', `$${D.summons.donateUsd}+`, 'Calls that summon instantly'],
  ['an unsealed superboss', `$${D.superboss.donateUsd}+`, 'Calls a superboss rematch'],
])}</div>
<div class="cols">
  <div class="block"><h3>Also counts</h3><ul class="plain">
    ${D.rewards.length ? `<li><b>Channel points</b> (Twitch/Kick): ${D.rewards.map(r => `“${esc(r.title)}”`).join(', ')}.</li>` : ''}
    <li><b>The World Boss meter:</b> every $1 wakes the World Boss a little more.</li>
    <li><b>Story votes:</b> donating during a vote adds ${D.votes.perUsd} extra vote per $1 to your pick.</li>
    <li><b>Class XP:</b> each $1 adds ${D.classes.xp.perUsd} XP to your current class.</li>
    <li><b>Mr. Krabs</b> takes ×2 from donations.</li>
  </ul></div>
  <div class="block"><h3>Loot</h3><p>When a monster falls, the party wins a challenge for the game being played. A sample:</p>
  <ul class="plain">${D.loot.slice(0, 5).map(l => `<li>${esc(l.replace('{mvp}', 'the MVP'))}</li>`).join('')}</ul></div>
</div>`);

/* ---------------- 8. hall of legends ---------------- */
const fmtDate = ms => new Date(ms).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
const legends = [];
if (P.champion) legends.push(`<div class="legend"><span class="label">Reigning ${esc(D.codex.champion)}</span><span class="big">🏆 ${esc(P.champion.name)}</span><span>Won the week of ${esc(P.champion.week)} with <span class="num">${n(P.champion.dmg)}</span> damage.</span></div>`);
const WCUR = (D.worldBosses || []).find(b => b.current && !b.locked) || W;
if (P.worldBoss?.defeated) legends.push(`<div class="legend"><span class="label">World Boss slain</span><span class="big">${WCUR.icon || '🌍'} ${esc(WCUR.name || 'The World Boss')}</span><span>Fell ${P.worldBoss.slainAt ? 'on ' + fmtDate(P.worldBoss.slainAt) : ''}. Bloomslayers: ${P.worldBoss.heroes.map(h => esc(h.name)).join(', ')}.</span></div>`);
for (const s of D.superbosses) if (!s.locked && s.first?.mvp) legends.push(`<div class="legend"><span class="label">First superboss clear</span><span class="big">${esc(s.badge)} ${esc(s.name)}</span><span>First defeated on ${fmtDate(s.first.at)}, MVP ${esc(s.first.mvp)}. ${s.holders} adventurers hold the title ${esc(s.title)}.</span></div>`);
if (P.codexHolders?.hunter) legends.push(`<div class="legend"><span class="label">Monster Codex</span><span class="big">📖 ${P.codexHolders.hunter} ${esc(D.codex.hunter)}${P.codexHolders.hunter > 1 ? 's' : ''}</span><span>${P.codexHolders.master ? P.codexHolders.master + ' ' + esc(D.codex.master) + '.' : 'Nobody has completed the full Monster Master codex yet.'}</span></div>`);
for (const h of D.honors || []) if (h.name) legends.push(`<div class="legend"><span class="label">Honored adventurer</span><span class="big">${esc(h.badge)} ${esc(h.name)}</span><span>“${esc(h.title)}”, with us since the Kingdom Hearts marathon. The legendary Mr. Krabs is named in his honor.</span></div>`);
if (legends.length) chapter('legends', 'Hall of Legends', 'Deeds the guild remembers.', `<div class="legend-grid">${legends.join('')}</div>`);

/* ---------------- render ---------------- */
$('#main').innerHTML = chapters.map(c => c.html).join('');
$('#tabs').innerHTML = chapters.map(c => `<a href="#${c.id}" data-id="${c.id}">${c.title}</a>`).join('');
const upd = P.savedAt ? new Date(P.savedAt) : new Date();
$('#foot').innerHTML = `<span>Progress as of ${upd.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}. Numbers come straight from the game's settings.</span><span>Questions? Ask in chat, or type <span class="cmd">!guide</span> on stream.</span>`;
const links = [...document.querySelectorAll('#tabs a')];
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) for (const a of links) a.classList.toggle('on', a.dataset.id === e.target.id);
}, { rootMargin: '-40% 0px -55% 0px' }) : null;
if (io) for (const c of chapters) io.observe(document.getElementById(c.id));
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
})();
</script>

</html>
